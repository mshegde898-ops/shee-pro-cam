#pn{display:none;background:var(--card);margin:0 8px;border-radius:14px;flex:none;max-height:40%;flex-direction:column}

#md b{padding:4px 2px;font-weight:600}#md b.on{color:var(--acc)}

#sh{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;position:relative}
#sh::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;transition:.15s}
#sh.vid::after{background:#e22}#sh.rec::after{inset:20px;border-radius:8px;background:#e22}
#res{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:9}
